<!doctype html>
<meta charset="utf-8">
<title>Media</title>
<h1>A page that starts playing by itself</h1>
<audio id="a" loop></audio>
<button id="play" onclick="document.getElementById('a').play()">Play</button>
<script>
  // One second of silence, made here: nothing to fetch.
  const rate = 8000, n = rate, buf = new ArrayBuffer(44 + n), v = new DataView(buf);
  const put = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  put(0, 'RIFF'); v.setUint32(4, 36 + n, true); put(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true);
  v.setUint16(22, 1, true); v.setUint32(24, rate, true); v.setUint32(28, rate, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
  put(36, 'data'); v.setUint32(40, n, true); new Uint8Array(buf, 44).fill(128);
  const a = document.getElementById('a');
  a.src = URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
  a.play().catch(() => {});
</script>
