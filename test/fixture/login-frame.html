<!doctype html>
<html>
<head><meta charset="utf-8"><title>Framed sign in</title></head>
<body>
  <!-- A sign-in form in a frame from another origin (localhost, where this page is 127.0.0.1). -->
  <iframe id="frame" width="400" height="200"></iframe>
  <script>
    window.got = [];
    addEventListener('message', (e) => window.got.push(e.data));
    document.getElementById('frame').src = `http://localhost:${location.port}/login-inner.html`;
  </script>
</body>
</html>
