<!doctype html>
<meta charset="utf-8">
<title>Full screen</title>
<style>html, body { margin: 0; height: 100%; } button { width: 100%; height: 100%; font-size: 40px; }</style>
<button id="go" onclick="document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()">Full screen</button>
