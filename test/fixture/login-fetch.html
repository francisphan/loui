<!doctype html>
<html>
<head><meta charset="utf-8"><title>Sign in by script</title></head>
<body>
  <!-- No form: the button "sends" the sign-in by script and the box goes away, as after a fetch. -->
  <div id="box">
    <input id="user" type="text" name="username">
    <input id="pass" type="password">
    <button id="go" type="button">Continue</button>
  </div>
  <p id="done" hidden>Welcome back.</p>
  <script>
    document.getElementById('go').onclick = () => setTimeout(() => {
      document.getElementById('box').remove();
      document.getElementById('done').hidden = false;
    }, 100);
  </script>
</body>
</html>
