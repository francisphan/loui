# Publishes a release that installed copies of Loui update to.
#
#   1. Set "version" in package.json (for example 0.2.0) and commit it.
#   2. git tag v0.2.0 && git push origin main v0.2.0
#
# The tests run first; if they pass, the Windows installer is built and attached
# to a GitHub release for the tag, with the latest.yml the updater reads. Then
# the Debian packages (the browser's, with the latest-linux.yml its updater
# reads, and the relay's) are built and added to the same release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false # nothing here pushes with git; the job's scripts get no write token from it

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag is $GITHUB_REF_NAME but package.json says $version." >&2
            exit 1
          fi

      - run: npm ci
      # Fetch Electron now, so the first test file doesn't pay for the download.
      - run: node -e "console.log(require('electron'))"

      - name: Test
        run: npm test
        timeout-minutes: 25

      - name: Build the Windows installer
        run: npm run dist:win

      # Published with gh rather than electron-builder, whose parallel uploads
      # raced to create the release and exited successfully with files missing.
      - name: Publish the release
        run: |
          version="$(node -p "require('./package.json').version")"
          gh release create "$GITHUB_REF_NAME" --title "Loui $version" --generate-notes \
            "dist/Loui-Setup-$version.exe" "dist/Loui-Setup-$version.exe.blockmap" dist/latest.yml
          gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name' | sort
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # After the Windows release, and apart from it: if this fails, the release
  # and Windows' updates stand, and the packages can be built and added by hand
  # (npm run dist:linux && npm run dist:relay, then gh release upload).
  debian:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build the Debian packages
        run: |
          npm run dist:linux
          npm run dist:relay

      - name: Add them to the release
        run: |
          version="$(node -p "require('./package.json').version")"
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            "dist/loui_${version}_amd64.deb" "dist/loui-relay_${version}_all.deb" dist/latest-linux.yml
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | sort
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
