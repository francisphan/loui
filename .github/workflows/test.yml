# Runs the end-to-end tests on every push to main and every pull request.
name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false # nothing here pushes with git; the job's scripts get no write token from it
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Fetch Electron now, so the first test file doesn't pay for the download.
      - run: node -e "console.log(require('electron'))"
      - run: npm test
